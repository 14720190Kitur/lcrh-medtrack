
workflows:
  default-workflow:
    name: LCRH MedTrack
    instance_type: mac_mini_m1
    max_build_duration: 20
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fix project and create Android folder
        script: |
          rm -rf android
          flutter create . --org com.lcrh --project-name medtrack --platforms=android
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/**/*.apk
